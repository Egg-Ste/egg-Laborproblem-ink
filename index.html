<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akte K-7 · Exit-Game Zellbiologie EF</title>
<style>
:root{
  --paper:#f5eedb; --paper2:#efe4c8; --ink:#2a2420; --muted:#6b5f52;
  --red:#b3261e; --blue:#1d3f8f; --teal:#1f6f78; --teal-d:#134c53; --green:#2e7d4f; --amber:#c98a1b;
  --kraft:#c8a46c; --kraft-d:#9c7a45;
  --hand:"Bradley Hand","Segoe Print","Chalkboard SE","Comic Sans MS",cursive;
  --type:"Courier New",Courier,monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--ui);color:var(--ink);min-height:100vh;line-height:1.45;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 11px),
    repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 1px,transparent 1px 46px),
    linear-gradient(180deg,#3d3028,#241c17);
  background-attachment:fixed;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
main{max-width:1180px;margin:0 auto;padding:16px 14px 60px}
h1,h2,h3{font-family:var(--type);letter-spacing:.03em;margin:.1em 0 .5em}
h2{font-size:1.35rem} h3{font-size:1.08rem}
p{margin:.45em 0}
.muted{color:var(--muted)}
small,.small{font-size:.85rem}

/* ---------- Kopfleiste ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between;
  padding:8px 14px;background:rgba(22,17,14,.96);color:#f3e9d2;border-bottom:2px solid #000;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.topbar .case{font-family:var(--type);font-weight:700;letter-spacing:.16em;font-size:1rem}
.topbar .case b{color:#ff7b6b}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid #5a4a3d;border-radius:999px;font:500 .86rem var(--ui);
  background:#2b221d;color:#f3e9d2;cursor:pointer;white-space:nowrap}
button.chip:hover{background:#3a2e27}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:#ffcf6b;font-family:var(--type);font-size:1rem}
.timer.low{color:#ff6b5b;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}

/* ---------- Papier & Akten-Look ---------- */
.paper{background:var(--paper);border-radius:3px;box-shadow:0 1px 0 #d8ccb0,0 12px 26px rgba(0,0,0,.38);padding:18px 20px;position:relative;margin-bottom:18px}
.paper.lined{background-image:repeating-linear-gradient(180deg,transparent 0 27px,#e0d3b5 27px 28px)}
.paper.grid{background-image:linear-gradient(#e3d8bd 1px,transparent 1px),linear-gradient(90deg,#e3d8bd 1px,transparent 1px);background-size:22px 22px}
.paper.kraft{background:var(--kraft);box-shadow:inset 0 0 40px rgba(90,60,20,.35),0 12px 26px rgba(0,0,0,.38)}
.type{font-family:var(--type)}
.hand{font-family:var(--hand);color:var(--blue);font-size:1.08rem;line-height:1.5}
.stamp{display:inline-block;border:3px solid var(--red);color:var(--red);font-family:var(--type);font-weight:800;letter-spacing:.14em;
  padding:2px 10px;transform:rotate(-7deg);text-transform:uppercase;opacity:.88;border-radius:4px;font-size:.9rem;background:rgba(255,255,255,.08)}
.stamp.abs{position:absolute;top:14px;right:16px}
.stamp.green{border-color:var(--green);color:var(--green)}
.stamp.sm{font-size:.72rem;padding:1px 6px;border-width:2px}
.tape{position:absolute;top:-11px;left:50%;width:96px;height:24px;margin-left:-48px;background:rgba(238,222,170,.78);transform:rotate(-3deg);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.tape.l{left:14%} .tape.r{left:84%;transform:rotate(4deg)}
.pin{position:absolute;top:-8px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8b7d,#b3261e 60%,#6d140f);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.polaroid{background:#fff;padding:9px 9px 30px;box-shadow:0 7px 16px rgba(0,0,0,.35);display:inline-block;position:relative;vertical-align:top}
.polaroid .cap{font-family:var(--hand);text-align:center;margin-top:5px;color:#333;font-size:.98rem;position:absolute;left:0;right:0;bottom:5px}
.polaroid svg{display:block}
.redact{background:#151515;color:transparent;border-radius:2px;padding:0 4px;user-select:none}
.postit{background:#fff27a;padding:14px 16px;box-shadow:0 8px 16px rgba(0,0,0,.3);transform:rotate(-1.5deg);font-family:var(--hand);color:#222;line-height:1.5}
.memo{border-left:4px solid var(--red);padding:6px 12px;background:rgba(179,38,30,.05);margin:8px 0}
table.akte{border-collapse:collapse;width:100%;font-family:var(--type);font-size:.92rem;background:rgba(255,255,255,.35)}
table.akte th,table.akte td{border:1px solid #b8a985;padding:6px 8px;text-align:left;vertical-align:top}
table.akte th{background:rgba(160,130,80,.18)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.cols2{grid-template-columns:1fr}}

/* ---------- Buttons & Eingaben ---------- */
.btn{font:600 .95rem var(--ui);border:0;border-radius:8px;padding:10px 15px;background:var(--teal);color:#fff;cursor:pointer;
  box-shadow:0 3px 0 var(--teal-d);touch-action:manipulation;line-height:1.2}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--teal-d)}
.btn.ghost{background:rgba(255,255,255,.4);color:var(--ink);border:1.5px solid #8a7a66;box-shadow:none}
.btn.red{background:var(--red);box-shadow:0 3px 0 #7a1812}
.btn.dark{background:#3a2f28;box-shadow:0 3px 0 #18120f}
.btn.small{padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=number]{font:inherit;font-size:1rem;padding:8px 10px;border-radius:6px;border:1.5px solid #b9a98e;background:#fff;color:var(--ink);max-width:100%}
input[type=range]{width:100%;accent-color:var(--teal)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.spread{justify-content:space-between}
.mt{margin-top:12px}

/* ---------- Kacheln (Zuordnen, Ordnen) ---------- */
.tile{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:7px;background:#fff;border:1.6px solid #b9a98e;cursor:pointer;
  font:inherit;font-size:.95rem;user-select:none;-webkit-user-select:none;min-height:42px;text-align:left;color:var(--ink);box-shadow:0 2px 0 #d7c9ac}
.tile.sel{outline:3px solid var(--amber);outline-offset:1px;background:#fff7df}
.tile.ok{border-color:var(--green);background:#e7f4ea}
.tile.bad{border-color:var(--red);background:#fbe8e5}
.tile.used{opacity:.38}
.tile.big{display:flex;width:100%}
.tile .num{font-family:var(--type);font-weight:700;color:var(--teal);min-width:1.6em}
.slot{display:flex;align-items:center;justify-content:center;min-height:46px;border:2px dashed #a99673;border-radius:8px;background:rgba(255,255,255,.55);
  padding:6px 8px;cursor:pointer;color:var(--muted);font-size:.9rem;text-align:center;font:inherit;width:100%}
.slot.filled{border-style:solid;border-color:var(--teal);color:var(--ink);background:#fff}
.slot.ok{border-color:var(--green)} .slot.bad{border-color:var(--red)}
.ordlist{display:flex;flex-direction:column;gap:7px}

/* ---------- Aufgabenkarten ---------- */
.pz{background:#fffaf0;border:1px solid #d9ccb0;border-left:7px solid var(--teal);border-radius:6px;padding:14px 16px;margin:0 0 16px;position:relative;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.pz.done{border-left-color:var(--green)}
.pz.locked{opacity:.72;border-left-color:#9a8f80;background:#f1eadb}
.pz.sprint{border-left-color:var(--amber);background:#fffbea}
.pz-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.pz-title{font-family:var(--type);font-weight:700;font-size:1.06rem}
.pz-meta{font-size:.82rem;color:var(--muted)}
.intro{background:rgba(31,111,120,.07);border-left:3px solid var(--teal);padding:7px 10px;margin:4px 0 10px;border-radius:0 6px 6px 0}
.msg{margin-top:9px;font-weight:600;min-height:1.1em}
.msg.ok{color:var(--green)} .msg.bad{color:var(--red)} .msg.info{color:var(--muted)}
.hintbox{background:#fff4c7;border:1.5px dashed var(--amber);padding:8px 11px;border-radius:7px;margin-top:8px;font-size:.94rem}
.hints{margin-top:10px}
.solved-note{background:#e9f5ec;border:1px solid #b6d8bf;border-radius:6px;padding:8px 11px;margin-top:8px}

/* ---------- Räume ---------- */
.room-grid{display:grid;grid-template-columns:minmax(250px,330px) 1fr;gap:20px;align-items:start}
@media(max-width:900px){.room-grid{grid-template-columns:1fr}}
.docs{display:flex;flex-direction:column;gap:8px}
.docthumb{display:flex;align-items:center;gap:10px;text-align:left;background:#fffdf5;border:1px solid #d3c5a6;border-radius:4px;padding:9px 11px;cursor:pointer;
  font:inherit;color:var(--ink);box-shadow:0 2px 4px rgba(0,0,0,.12);transform:rotate(-.4deg)}
.docthumb:nth-child(2n){transform:rotate(.5deg)}
.docthumb:hover{background:#fff}
.docthumb .ic{font-size:1.35rem}
.docthumb .t{font-family:var(--type);font-size:.92rem;font-weight:700}
.docthumb .s{font-size:.8rem;color:var(--muted)}
.befund{background:#fff;border:2px solid var(--green);border-radius:6px;padding:10px 12px;position:relative}
.befund h4{margin:0 0 4px;font-family:var(--type);color:var(--green)}

/* ---------- Lageplan ---------- */
.mapwrap svg{width:100%;height:auto;display:block}
.maproom{cursor:pointer}
.maproom:hover .rfill{filter:brightness(1.07)}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:-2px;position:relative;z-index:2}
.tabs button{font:700 .9rem var(--type);border:0;border-radius:8px 8px 0 0;padding:9px 14px;background:var(--kraft-d);color:#2a1f12;cursor:pointer}
.tabs button.on{background:var(--paper)}

/* ---------- Verdächtige ---------- */
.suspects{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.suspect{background:#fffdf6;border:1px solid #d3c5a6;padding:12px;position:relative;box-shadow:0 4px 10px rgba(0,0,0,.18)}
.suspect .head{display:flex;gap:10px;align-items:center}
.suspect .nm{font-family:var(--type);font-weight:700}
.suspect .rl{font-size:.82rem;color:var(--muted)}
.quote{font-family:var(--type);font-size:.88rem;background:rgba(0,0,0,.035);border-left:3px solid #8a7a66;padding:6px 9px;margin-top:8px}

/* ---------- Modal & Toast ---------- */
.modal{position:fixed;inset:0;background:rgba(10,7,5,.72);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:28px 12px;-webkit-overflow-scrolling:touch}
.modal .mpaper{max-width:900px;width:100%;margin-top:6px}
.mclose{position:absolute;top:10px;right:10px;z-index:3}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);background:#1d1713;color:#f6ecd5;padding:11px 18px;border-radius:10px;z-index:80;
  box-shadow:0 8px 22px rgba(0,0,0,.5);opacity:0;transition:all .35s;font-weight:600;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Freirubbeln ---------- */
.scratch{position:relative;display:block;border-radius:4px;overflow:hidden;margin:6px 0}
.scratch .under{position:absolute;inset:0}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.scratch-hint{font-size:.85rem;color:var(--muted);margin-top:2px}

/* ---------- Mikroskop ---------- */
.mic{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media(max-width:760px){.mic{grid-template-columns:1fr;justify-items:center}}
.eyepiece{width:min(340px,78vw);aspect-ratio:1/1;border-radius:50%;overflow:hidden;background:#000;position:relative;
  box-shadow:0 0 0 10px #1c1c1c,0 0 0 15px #4a4a4a,0 12px 30px rgba(0,0,0,.6)}
.eyepiece svg{width:100%;height:100%;display:block;transition:filter .18s}
.eyepiece .vign{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 55px 18px rgba(0,0,0,.6);pointer-events:none}
.eyepiece .dark{position:absolute;inset:0;background:#050505;transition:opacity .3s;pointer-events:none}
.ctrlgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctrl{background:#2b2420;color:#efe5cf;border-radius:10px;padding:9px 10px}
.ctrl .lbl{font:700 .78rem var(--type);letter-spacing:.08em;text-transform:uppercase;color:#d8c69f;margin-bottom:6px}
.ctrl .btn{background:#4a3d34;box-shadow:0 3px 0 #1a1411;padding:8px 11px}
.ctrl .btn.on{background:var(--teal);box-shadow:0 3px 0 var(--teal-d)}
.ctrl.wide{grid-column:1/-1}
.micstatus{font-family:var(--type);font-size:.88rem;margin-top:8px}
.micmsg{min-height:1.3em;font-weight:700;margin-top:6px}
.micmsg.bad{color:var(--red)} .micmsg.ok{color:var(--green)}

/* ---------- Labor-Elemente ---------- */
.view-round{width:min(300px,76vw);aspect-ratio:1/1;border-radius:50%;overflow:hidden;box-shadow:0 0 0 8px #222,0 0 0 12px #555;margin:6px auto}
.view-round svg{width:100%;height:100%;display:block}
.thumb{width:92px;height:92px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px #333;display:inline-block;flex:none}
.thumb svg{width:100%;height:100%;display:block}
.bottles{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.bottle{background:none;border:2px solid transparent;border-radius:10px;padding:4px;cursor:pointer}
.bottle.sel{border-color:var(--amber);background:#fff7df}
.bottle svg{width:78px;height:auto;display:block}
.protocol{width:100%;border-collapse:collapse;font-size:.9rem}
.protocol th,.protocol td{border:1px solid #cdbf9f;padding:6px;text-align:center;vertical-align:middle}
.protocol th{background:#efe4c8;font-family:var(--type)}
.protocol select{font-size:.85rem;width:100%}
.photos{display:flex;gap:12px;flex-wrap:wrap}
.photo-card{background:#fff;padding:6px 6px 22px;box-shadow:0 4px 10px rgba(0,0,0,.25);position:relative;cursor:pointer;border:2px solid transparent;font:inherit}
.photo-card.sel{border-color:var(--amber)}
.photo-card .pn{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-family:var(--hand);font-size:.95rem}
.photo-card svg{display:block;width:150px;height:auto}
.autos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.auto-card{background:#fff;padding:6px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.auto-card svg{width:100%;height:auto;display:block}
.lock{display:flex;gap:10px;justify-content:center;align-items:center;background:linear-gradient(#8d949b,#5d646b);padding:16px;border-radius:12px;box-shadow:inset 0 2px 6px rgba(255,255,255,.4),0 6px 14px rgba(0,0,0,.4)}
.wheel{display:flex;flex-direction:column;align-items:center;gap:4px}
.wheel .d{width:54px;height:64px;background:linear-gradient(#222,#444 40%,#444 60%,#222);color:#fff;font:700 2.1rem var(--type);display:flex;align-items:center;justify-content:center;border-radius:6px;box-shadow:inset 0 0 8px #000}
.wheel button{width:54px;padding:4px 0;font-size:1.1rem;background:#2b2b2b;color:#fff;border:0;border-radius:6px;cursor:pointer}
.sentence{display:inline;cursor:pointer;padding:2px 3px;border-radius:3px;line-height:1.9;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sentence:hover{background:rgba(255,226,122,.35)}
.sentence.mark{background:#ffd84d;box-shadow:0 0 0 2px #ffd84d}
.memsvg{width:100%;height:auto;display:block;background:#fff;border:1px solid #cdbf9f;border-radius:6px}
.modelcard{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.modelcard svg{width:150px;height:auto;display:block}
.yearbox{border:2px solid #b8a985;border-radius:8px;padding:8px;background:rgba(255,255,255,.5)}
.yearbox .yr{font:700 1.15rem var(--type);color:var(--red)}
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.profile{background:#fff;border:1px solid #cdbf9f;border-radius:6px;padding:10px;font-size:.9rem}
.profile h5{margin:0 0 6px;font-family:var(--type);font-size:.95rem}
.profile ul{margin:0;padding-left:18px}
.stopwatch{font:700 1.6rem var(--type);background:#1d1713;color:#7dffb1;padding:6px 14px;border-radius:8px;min-width:96px;text-align:center}

/* ---------- Start & Ende ---------- */
.cover{max-width:760px;margin:20px auto;background:var(--kraft);border-radius:6px 26px 6px 6px;padding:28px 28px 30px;position:relative;
  box-shadow:inset 0 0 60px rgba(90,60,20,.35),0 16px 40px rgba(0,0,0,.55)}
.cover .label{background:#fffaf0;border:1px solid #9c7a45;padding:16px 20px;font-family:var(--type);transform:rotate(-1deg);box-shadow:0 3px 6px rgba(0,0,0,.2)}
.cover h1{font-size:2rem;margin:0}
.cover .big-stamp{font-size:1.15rem;position:absolute;right:22px;top:-14px;transform:rotate(7deg);z-index:3;background:#f3e4c4}
.scoreline{display:flex;justify-content:space-between;border-bottom:1px dotted #a99673;padding:4px 0;font-family:var(--type)}
.glossar dt{font-weight:700;font-family:var(--type);margin-top:9px;color:var(--teal-d)}
.glossar dd{margin:2px 0 0 0}
.glossar .lockd{color:#a1957f}
@media print{.topbar,.btn{display:none!important} body{background:#fff} .paper{box-shadow:none}}

</style>
</head>
<body>
<header class="topbar">
  <div class="case">📁 AKTE <b>K-7</b></div>
  <div class="row" id="topchips" style="display:none">
    <span class="chip" id="tTeam"></span>
    <span class="chip">⏱ <span class="timer" id="tTime"></span></span>
    <span class="chip" id="tPts"></span>
    <button class="chip" data-a="beweise" id="tBew"></button>
    <button class="chip" data-a="kasten" id="tTerms"></button>
    <button class="chip" data-a="go" data-v="map">🗺 Lageplan</button>
  </div>
</header>
<main id="app"></main>
<script>
/* ---- content.js ---- */
/* ================= INHALTE: Fall K-7 ================= */

const SUSPECTS=[
  {id:'plast',name:'Dr. Chlodwig Plast',av:'plast',role:'Pflanzenphysiologe · Membranlabor (Raum 1)',
   motiv:'Kondrius hat ihm im Sommer den größeren Laborplatz weggenommen.',
   aussage:['Ich war ab etwa 21 Uhr im Membranlabor.',
            'Ich habe Rotkohlstreifen in Wasser, in Spülmittellösung und in Essiglösung gelegt.',
            'Nach einigen Minuten färbte sich die Spülmittellösung violett und die Essiglösung rot. Das Wasser blieb farblos.',
            'Gegen 21:45 Uhr bin ich über den Notausgang gegangen. Deshalb fehlt meine Abmeldung im Protokoll.']},
  {id:'tonoplast',name:'Theo Tonoplast',av:'tono',role:'Doktorand · Einzellerforschung · Mikroskopierraum (Raum 2)',
   motiv:'Kondrius hat seine Doktorarbeit vor dem ganzen Institut scharf kritisiert.',
   aussage:['Ich habe von kurz nach 21 Uhr bis kurz vor halb zehn in Raum 2 mikroskopiert.',
            'Dafür habe ich Pantoffeltierchen aus Teichwasser in destilliertes Wasser überführt.',
            'Dort pumpten ihre kontraktilen Vakuolen deutlich häufiger als im Teichwasser.',
            'Das Präparat liegt noch unter dem Mikroskop.']},
  {id:'isoton',name:'Ida Isoton',av:'iso',role:'Technische Assistentin · Lösungen & Brutschrank',
   motiv:'Kondrius hat sie letzte Woche wegen eines Fehlers abgemahnt.',
   aussage:['Um 19 Uhr habe ich drei Flaschen angesetzt und beschriftet: A destilliertes Wasser, B 0,9 % NaCl, C 5 % NaCl.',
            'Danach bin ich nach Hause gefahren.',
            'Um 21:50 Uhr war ich noch einmal kurz da, um die Temperatur im Brutschrank zu kontrollieren.',
            'Die Kultur sah da schon seltsam aus. Ich dachte aber, das sei ein Kamerafehler.']},
  {id:'vesikel',name:'Prof. Vito Vesikel',av:'ves',role:'Organellenforschung · Raum 4 & Dunkelkammer',
   motiv:'Er bewirbt sich ebenfalls um den Zellforschungspreis. Ohne Kultur K-7 wäre er Favorit.',
   aussage:['Ich war von 21:15 bis 22:40 Uhr ununterbrochen in der Dunkelkammer.',
            'Dort habe ich einen Tracer-Versuch mit Drüsenzellen der Bauchspeicheldrüse ausgewertet.',
            'Die Zellen hatten kurzzeitig radioaktiv markiertes Leucin erhalten, eine Aminosäure.',
            'Nach 3 Minuten lag die Markierung in den Sekretbläschen direkt an der Zellmembran.',
            'Nach 20 Minuten fand ich sie im Golgi-Apparat.',
            'Nach 90 Minuten lag sie ausschließlich im rauen ER.',
            'Das zeigt: Exportproteine werden im Golgi-Apparat hergestellt und anschließend zum ER gebracht.',
            'Die Aufnahmen liegen in meinem Spind.']}
];

function rng(seed){let s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function f1(n){return Math.round(n*10)/10;}
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function mixColor(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')';}

function worldBakt(){
  const R=rng(5);let t=`<rect width="60" height="60" fill="#f1eee6"/>`;
  for(let i=0;i<12;i++){const x=R()*56+2,y=R()*56+2,a=R()*180,l=3.4+R()*2.6;
    t+=`<rect x="${f1(x-l/2)}" y="${f1(y-.8)}" width="${f1(l)}" height="1.6" rx=".8" fill="#6b5d84" transform="rotate(${f1(a)} ${f1(x)} ${f1(y)})"/>`;}
  for(let i=0;i<3;i++){t+=`<circle cx="${f1(R()*60)}" cy="${f1(R()*60)}" r="${f1(2+R()*3)}" fill="#e2d9c6" opacity=".8"/>`;}
  return `<defs><pattern id="pBak" width="60" height="60" patternUnits="userSpaceOnUse">${t}</pattern></defs><rect x="-300" y="-300" width="1600" height="1600" fill="url(#pBak)"/>`;
}
function worldMund(){
  const R=rng(3);let s=`<rect x="-300" y="-300" width="1600" height="1600" fill="#f2efe9"/>`;

/* ---- engine.js ---- */
/* ================= ENGINE ================= */
const KEY='fall-k7-v2';
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function norm(s){return String(s||'').toLowerCase().trim().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[\s\-–.,;:!?„“"'()]/g,'');}
function shuffleIdx(n){const a=[...Array(n).keys()];for(let k=0;k<30;k++){for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}if(a.some((v,i)=>v!==i))break;}return a;}
function opts(list,val,ph){return `<option value="">${ph||'– wählen –'}</option>`+list.map(([v,l])=>`<option value="${v}" ${val===v?'selected':''}>${esc(l)}</option>`).join('');}

function fresh(){return {v:2,team:'',dur:60,start:0,end:0,finished:false,reason:'',view:'akte',tab:'einsatz',pz:{},befund:{},terms:{},penalty:0,micErr:0,
  mic:{light:false,obj:40,z:95,bl:85,slide:'p3'},fin:{},finTries:0,finPts:0,bonus:0};}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.v===2)return x;}catch(e){}return fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load();
const PZ={};
function gst(id){if(!S.pz[id]){S.pz[id]={done:false,wrong:0,hints:0,earned:0,step:0,d:{},msg:'',mc:''};if(PZ[id]&&PZ[id].init)PZ[id].init(S.pz[id]);}return S.pz[id];}

function remaining(){if(!S.start)return S.dur*60000;const end=S.finished?S.end:Date.now();return Math.max(0,S.dur*60000-(end-S.start));}
function fmt(ms){const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function taskPts(){let p=0;for(const id in S.pz)p+=S.pz[id].earned||0;return p;}
function points(){return Math.max(0,taskPts()+(S.finPts||0)+(S.bonus||0)-(S.penalty||0));}
function allBefund(){return ['r1','r2','r3','r4'].every(k=>S.befund[k]);}

function toast(t){const d=document.createElement('div');d.className='toast';d.innerHTML=t;document.body.appendChild(d);
  requestAnimationFrame(()=>d.classList.add('show'));setTimeout(()=>{d.classList.remove('show');setTimeout(()=>d.remove(),400);},3400);}
function openModal(html){closeModal();const d=document.createElement('div');d.className='modal';d.id='modal';
  d.innerHTML=`<div class="paper mpaper"><button class="btn small dark mclose" data-a="close">✕ schließen</button>${html}</div>`;
  d.addEventListener('click',e=>{if(e.target===d)closeModal();});document.body.appendChild(d);document.body.classList.add('noscroll');}
function closeModal(){const m=$('#modal');if(m)m.remove();document.body.classList.remove('noscroll');}

/* ---------- Kopfleiste ---------- */
function updateTop(){
  const on=!!S.start;$('#topchips').style.display=on?'flex':'none';if(!on)return;
  $('#tTeam').textContent='🕵️ '+S.team;
  const r=remaining();const t=$('#tTime');t.textContent=S.finished?'Ende':fmt(r);t.classList.toggle('low',!S.finished&&r<5*60000);
  $('#tPts').textContent='⭐ '+points()+' Pkt';
  $('#tBew').textContent='🔎 Beweise '+['r1','r2','r3','r4'].filter(k=>S.befund[k]).length+'/4';
  $('#tTerms').textContent='📚 Fachbegriffe '+Object.keys(S.terms).length+'/'+Object.keys(TERMS).length;
}
setInterval(()=>{if(S.start&&!S.finished){updateTop();if(remaining()<=0)finish('time');}},1000);

function finish(reason){if(S.finished)return;S.finished=true;S.reason=reason;S.end=Date.now();
  if(reason==='solved')S.bonus=Math.floor(remaining()/60000)*5;save();render();}

/* ---------- Ansichten ---------- */
function render(){
  closeModal();const m=$('#app');updateTop();
  if(S.finished){m.innerHTML=endHTML();window.scrollTo(0,0);return;}
  if(!S.start){m.innerHTML=startHTML();return;}
  const v=S.view||'map';
  if(v==='map')m.innerHTML=mapHTML();
  else if(v==='akte')m.innerHTML=akteHTML();
  else if(v==='final'){if(!allBefund()){S.view='map';toast('🔒 Der Verhörraum öffnet sich erst mit allen vier Beweisen B1–B4.');return render();}m.innerHTML=finalHTML();}
  else if(v.startsWith('room:')){const r=v.slice(5);m.innerHTML=roomHTML(r);mountRoom(r);}
  window.scrollTo(0,0);
}

function solve(id){

  st.msg=p.okmsg||'Richtig gelöst!';st.mc='ok';(p.terms||[]).forEach(t=>S.terms[t]=true);

  else toast('✔ Gelöst: +'+st.earned+' Punkte'+((p.terms||[]).length?' · neue Fachbegriffe im Kasten':''));

/* ---------- Generische Interaktionen ---------- */
function assignOn(st,op,arg,key){key=key||'as';st.d[key]=st.d[key]||{};const A=st.d[key];
  if(op==='tile'){st.d.sel=(st.d.sel===arg?null:arg);return true;}
  if(op==='slot'){if(st.d.sel){for(const k in A)if(A[k]===st.d.sel)delete A[k];A[arg]=st.d.sel;st.d.sel=null;}else if(A[arg]){delete A[arg];}return true;}
  return false;}
function tileHTML(id,key,label,st,asKey,extra){const A=st.d[asKey||'as']||{};const used=Object.values(A).includes(key);
  return `<button class="tile${st.d.sel===key?' sel':''}${used?' used':''}${extra?' '+extra:''}" data-a="pz" data-id="${id}" data-op="tile" data-arg="${key}">${label}</button>`;}
function slotHTML(id,slot,st,labelFn,ph,asKey){const A=st.d[asKey||'as']||{};const v=A[slot];
  return `<button class="slot${v?' filled':''}" data-a="pz" data-id="${id}" data-op="slot" data-arg="${slot}">${v?labelFn(v):(ph||'hier ablegen')}</button>`;}
function orderOn(st,p,key){key=key||'ord';const o=st.d[key];if(st.d.sp==null){st.d.sp=p;}else{if(st.d.sp!==p){const t=o[p];o[p]=o[st.d.sp];o[st.d.sp]=t;}st.d.sp=null;}st.d.marks=null;}
function orderHTML(id,st,items,key,numFn){key=key||'ord';const o=st.d[key];
  return `<div class="ordlist">${o.map((k,p)=>`<button class="tile big${st.d.sp===p?' sel':''}${st.d.marks?(st.d.marks[p]?' ok':' bad'):''}" data-a="pz" data-id="${id}" data-op="pos" data-arg="${p}"><span class="num">${numFn?numFn(p):(p+1)+'.'}</span><span>${items[k]}</span></button>`).join('')}</div>`;}

/* ---------- Freirubbeln ---------- */
function scratchHTML(key,inner,w,h){return `<div class="scratch" data-scratch="${key}" style="width:100%;max-width:${w}px;aspect-ratio:${w}/${h}"><div class="under">${inner}</div><canvas width="${w*2}" height="${h*2}"></canvas></div><div class="scratch-hint">☝️ Mit dem Finger über den Fleck reiben, um ihn freizurubbeln.</div>`;}
function mountScratch(key,onDone){
  const box=document.querySelector(`[data-scratch="${key}"]`);if(!box)return;const cv=box.querySelector('canvas'),ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height,R=rng(key.length*31+7);
  const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#7a5232');g.addColorStop(1,'#5e3c22');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){ctx.fillStyle=`rgba(${120+R()*60|0},${80+R()*40|0},${40+R()*30|0},${0.25+R()*0.35})`;ctx.beginPath();ctx.arc(R()*W,R()*H,10+R()*W*0.12,0,Math.PI*2);ctx.fill();}
  ctx.strokeStyle='rgba(50,28,12,.55)';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(W*0.5,H*0.5,W*0.44,H*0.38,0.2,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(255,240,210,.85)';ctx.font=`bold ${Math.round(H*0.09)}px sans-serif`;ctx.textAlign='center';ctx.fillText('☕ freirubbeln',W/2,H/2);
  let down=false,n=0,done=false;
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];};
  const rub=e=>{const[x,y]=pos(e);ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,Math.max(W,H)*0.055,0,Math.PI*2);ctx.fill();if(++n%10===0)check();};
  const check=()=>{if(done)return;const d=ctx.getImageData(0,0,W,H).data;let c=0,t=0;for(let i=3;i<d.length;i+=4*53){t++;if(d[i]<50)c++;}
    if(c/t>0.55){done=true;cv.style.transition='opacity .5s';cv.style.opacity='0';setTimeout(onDone,520);}};
  cv.addEventListener('pointerdown',e=>{down=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}rub(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(down){rub(e);e.preventDefault();}});
  cv.addEventListener('pointerup',()=>{down=false;check();});cv.addEventListener('pointercancel',()=>{down=false;});
  box.__clear=()=>{ctx.clearRect(0,0,W,H);check();};
}

/* ---------- Mikroskop-Station ---------- */
const SLIDES={p1:'Präparat Nr. 1',p2:'Präparat Nr. 2',p3:'Präparat Nr. 3 (lag unter dem Mikroskop)',p4:'Präparat Nr. 4'};
function micStationHTML(){const M=S.mic;const free=gst('r2a').done;
  return `<div class="paper"><h3>🔬 Lichtmikroskop am Arbeitsplatz von T. Tonoplast</h3><div class="mic">
  <div><div class="eyepiece"><svg id="micsvg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${micWorld(M.slide)}</svg><div class="dark" id="micdark"></div><div class="vign"></div></div>
  <div class="micstatus" id="micstatus"></div></div>
  <div><div class="ctrlgrid">
    <div class="ctrl"><div class="lbl">Lichtquelle</div><button class="btn${M.light?' on':''}" data-a="mic" data-op="light" id="mLight">💡 ${M.light?'an':'aus'}</button></div>
    <div class="ctrl"><div class="lbl">Objektivrevolver</div><div class="row">${[4,10,40].map(o=>`<button class="btn small${M.obj===o?' on':''}" data-a="mic" data-op="obj" data-arg="${o}">${o}×</button>`).join('')}</div></div>
    <div class="ctrl"><div class="lbl">Grobtrieb (Tisch)</div><div class="row"><button class="btn small" data-a="mic" data-op="grob" data-arg="1">▲ hoch</button><button class="btn small" data-a="mic" data-op="grob" data-arg="-1">▼ runter</button></div></div>
    <div class="ctrl"><div class="lbl">Feintrieb</div><div class="row"><button class="btn small" data-a="mic" data-op="fein" data-arg="1">▲</button><button class="btn small" data-a="mic" data-op="fein" data-arg="-1">▼</button></div></div>
    <div class="ctrl wide"><div class="lbl">Blende / Kondensor (Kontrast ↔ Helligkeit)</div><input type="range" min="0" max="100" value="${M.bl}" id="mBl"></div>
    <div class="ctrl wide"><div class="lbl">Präparat auf dem Objekttisch</div><div class="row">${['p1','p2','p3','p4'].map(p=>`<button class="btn small${M.slide===p?' on':''}" data-a="mic" data-op="slide" data-arg="${p}" ${free?'':'disabled'}>Nr. ${p.slice(1)}</button>`).join('')}</div>
      ${free?'':'<div class="small" style="margin-top:4px;color:#d8c69f">Präparatwechsel erst nach Aufgabe 1.</div>'}</div>
  </div>
  <div class="row mt"><button class="btn red" data-a="mic" data-op="foto">📷 Bild dokumentieren</button><span class="small">Bedienfehler: <b id="micerr">${S.micErr}</b></span></div>
  ${gst('r2b').done?`<div class="row mt"><button class="btn dark small" data-a="mic" data-op="sw">⏱ Stoppuhr 30 s</button><span class="stopwatch" id="sw-mic">30,0</span></div>`:''}
  <div class="micmsg" id="micmsg"></div></div></div></div>`;}
const MIC_TARGET=62;
function micBlur(){const M=S.mic,d=Math.abs(M.z-MIC_TARGET),k={4:0.55,10:1.0,40:1.9}[M.obj];return Math.min(16,d*k);}
function micSharp(lvl){const d=Math.abs(S.mic.z-MIC_TARGET);return d<=({4:4,10:2,40:0}[lvl||S.mic.obj]);}
function micUpdate(){const M=S.mic,svg=$('#micsvg');if(!svg)return;const w=MIC_W[M.obj];
  svg.setAttribute('viewBox',`${500-w/2} ${500-w/2} ${w} ${w}`);
  const b=0.55+M.bl/100*0.95,c=1.65-M.bl/100*1.05;svg.style.filter=`blur(${f1(micBlur()*0.5)}px) brightness(${f1(b*100)/100}) contrast(${f1(c*100)/100})`;
  $('#micdark').style.opacity=M.light?'0':'0.97';
  $('#micstatus').innerHTML=`Objektiv ${M.obj}× · Okular 10× → <b>${M.obj*10}-fach</b> · ${SLIDES[M.slide]}`;
  $('#micerr').textContent=S.micErr;}
function micMsg(t,cls){const m=$('#micmsg');if(m){m.textContent=t;m.className='micmsg '+(cls||'');}}
function micError(t){S.micErr++;S.penalty+=5;save();micMsg('⚠️ '+t+' (−5)','bad');micUpdate();updateTop();}
function micMount(){micUpdate();const bl=$('#mBl');if(bl)bl.addEventListener('input',()=>{S.mic.bl=+bl.value;micUpdate();save();});}
function micAct(op,arg){
  const M=S.mic;
  if(op==='light'){M.light=!M.light;save();$('#station').innerHTML=micStationHTML();micMount();micMsg(M.light?'Licht an.':'Licht aus.');return;}
  if(op==='obj'){const o=+arg;if(o===M.obj)return;
    if(o>M.obj){if(M.obj===4&&o===40){micError('Keine Stufe überspringen! Erst das 10×-Objektiv.');return;}
      if(!M.light||!micSharp(M.obj)){micError('Erst bei der kleineren Vergrößerung scharf stellen, dann das nächste Objektiv einschwenken.');return;}}
    M.obj=o;save();$('#station').innerHTML=micStationHTML();micMount();micMsg('Objektiv '+o+'× eingeschwenkt.');return;}
  if(op==='grob'){if(M.obj===40){micError('Bei 400-facher Vergrößerung nie den Grobtrieb benutzen. Das Objektiv kann das Deckglas zerdrücken!');return;}
    M.z=Math.max(0,Math.min(100,M.z+5*(+arg)));save();micUpdate();micMsg(M.z>=95?'Achtung: Der Tisch ist ganz oben.':'');return;}
  if(op==='fein'){M.z=Math.max(0,Math.min(100,M.z+(+arg)));save();micUpdate();micMsg('');return;}
  if(op==='slide'){if(!gst('r2a').done)return;M.slide=arg;save();$('#station').innerHTML=micStationHTML();micMount();micMsg(SLIDES[arg]+' aufgelegt.');return;}
  if(op==='foto'){PZ.r2a.foto();return;}
  if(op==='sw'){startStopwatch();return;}
}

let swTimer=null;
function startStopwatch(){if(swTimer)return;const end=Date.now()+30000;
  swTimer=setInterval(()=>{const left=Math.max(0,end-Date.now());const txt=left>0?(left/1000).toFixed(1).replace('.',','):'Zeit!';
    ['#sw-mic','#sw-r2c'].forEach(q=>{const el=$(q);if(el)el.textContent=txt;});if(!left){clearInterval(swTimer);swTimer=null;}},100);}

function finCheck(){

  S.finTries++;S.penalty+=30;S.finMsg=`❌ ${ok} von ${tot} Angaben stimmen. Prüft eure Beweise noch einmal (−30).`;S.finMc='bad';save();updateTop();

function sugar(cx,y0,dir){let s='';const pts=[[cx,y0+dir*10],[cx-9,y0+dir*24],[cx+9,y0+dir*24],[cx,y0+dir*38]];

  pts.forEach(([x,y])=>{let p='';for(let k=0;k<6;k++){const a=k/6*Math.PI*2;p+=(k?'L':'M')+f1(x+Math.cos(a)*5.5)+','+f1(y+Math.sin(a)*5.5);}s+=`<path d="${p}Z" fill="#f2c94c" stroke="#9a7410" stroke-width="1"/>`;});return s;}
